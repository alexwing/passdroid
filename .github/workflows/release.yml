name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.0.0). Leave blank to use version from package.json.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Application with Tauri
        run: npx tauri build

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path windows-dist

          # 1. Standalone / Portable executable
          $binary = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" | Where-Object { $_.Name -notmatch "build|installer|setup" } | Select-Object -First 1
          if (Test-Path "src-tauri/target/release/passdroid-next.exe") {
            Copy-Item "src-tauri/target/release/passdroid-next.exe" "windows-dist/Passdroid-v$version-Standalone.exe" -Force
            Write-Host "Prepared Standalone: windows-dist/Passdroid-v$version-Standalone.exe"
          } elseif ($binary) {
            Copy-Item $binary.FullName "windows-dist/Passdroid-v$version-Standalone.exe" -Force
            Write-Host "Prepared Standalone: windows-dist/Passdroid-v$version-Standalone.exe"
          } else {
            Write-Error "Standalone executable not found in src-tauri/target/release/"
          }

          # 2. NSIS Setup Installer
          $nsisSetup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisSetup) {
            $nsisSetup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($nsisSetup) {
            Copy-Item $nsisSetup.FullName "windows-dist/Passdroid-v$version-Setup.exe" -Force
            Write-Host "Prepared NSIS: windows-dist/Passdroid-v$version-Setup.exe"
          } else {
            Write-Host "NSIS setup executable not found"
          }

          # 3. MSI Installer
          $msiInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiInstaller) {
            Copy-Item $msiInstaller.FullName "windows-dist/Passdroid-v$version.msi" -Force
            Write-Host "Prepared MSI: windows-dist/Passdroid-v$version.msi"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: windows-dist/*
          if-no-files-found: error

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Configure Android Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p src-tauri/gen/android/app
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured! Release APKs MUST be signed with the official release keystore to ensure update compatibility."
            exit 1
          fi

          echo "Configuring official keystore from repository secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/release.jks

          # Validate keystore integrity
          keytool -list -keystore src-tauri/gen/android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore verified successfully."

          cat <<EOF > src-tauri/gen/android/app/keystore.properties
storeFile=release.jks
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --target aarch64

      - name: Prepare Android Release Artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p android-dist
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in build outputs!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "android-dist/Passdroid-v${VERSION}-Android.apk"
          echo "Prepared APK: android-dist/Passdroid-v${VERSION}-Android.apk"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: android-dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag and Title
        id: release_info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "title=Passdroid ${TAG}" >> $GITHUB_OUTPUT

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-assets

      - name: Inspect Release Assets
        shell: bash
        run: |
          echo "Release assets ready for publication:"
          ls -lah release-assets/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
