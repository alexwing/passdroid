[package]
name = "passdroid-core"
version = "0.1.0"
description = "Pure-Rust Passdroid vault core: envelope, crypto, merge and password generation (no I/O, no platform code)"
authors = ["Passdroid Next"]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

# wasm32-only browser backends, so the core also builds standalone for
# wasm32-unknown-unknown (same setup as crates/passdroid-wasm). rand_core pulls
# getrandom 0.2 and uuid pulls getrandom 0.4; each needs its own backend there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# uuid refuses to build on wasm32-unknown-unknown without an explicit RNG source;
# reuse the getrandom 0.4 browser backend enabled above.
uuid = { version = "1", features = ["rng-getrandom"] }
# chrono's `clock` (default feature) reads Date.now() through js-sys on wasm32.
chrono = { version = "0.4", features = ["wasmbind"] }
