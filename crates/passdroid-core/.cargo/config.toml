# getrandom >= 0.3 selects its browser backend through a cfg flag (the
# `wasm_js` feature alone is not enough). Scoped to wasm32 only.
# NOTE: a RUSTFLAGS env var REPLACES this key, so build.mjs / the simd build
# must repeat the --cfg flag.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
